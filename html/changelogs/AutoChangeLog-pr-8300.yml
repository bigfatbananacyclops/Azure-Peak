author: "WeNeedMorePhoron"
delete-after: True
changes:
  - rscdel: "Remove the use bandage (doesn't really exists in most case) and use healing potions from NPC, which can feel pretty unfair as they chug like crazy"
  - rscadd: "Reduced the rate of fire of most archer by reworking to a new formula that presume 1.5 seconds is used to click the quiver and a minimum aim time of 0.5 s, removed special arrows, reduced incidence of bodkin arrows massively on high tier archers and removed it entirely from low tier archers. Reduced ammo supplies of most NPC archers. This should result in them feeling fairer to fight and less machinegunny. A mistake made in the old formula resulted in most hitting the minimum floor of 2 seconds ROF."
  - rscdel: "Stopped NPC from looting gears they won't use and cleaned up some code."
  - rscadd: "Slightly buff the earlier waves in a blockade and rewards"